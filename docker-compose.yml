# ============================================================
# DocClean Docker Compose 配置
#
# 使用方式（在项目根目录执行）：
#
#   1. 确保 backend/.env 文件存在（从 .env.example 复制）
#      copy .env.example backend\.env     （Windows CMD）
#      cp .env.example backend/.env        （Linux / Mac / Git Bash）
#
#   2. 启动 CPU 版本（默认，无需显卡）：
#      docker-compose up -d
#
#   3. 启动 GPU 版本（需要 NVIDIA 显卡 + nvidia-container-toolkit）：
#      把下面第 39 行的 "Dockerfile" 改成 "Dockerfile.gpu"
#      取消第 45-51 行 deploy 部分的注释
#      然后执行：docker-compose up -d
#
#   4. 打开浏览器访问：http://localhost:5000
#
#   5. 停止：docker-compose down
# ============================================================

services:
  docclean:
    build:
      context: .
      dockerfile: Dockerfile
      # GPU 用户：把上面一行改成 →  dockerfile: Dockerfile.gpu
    container_name: docclean
    ports:
      - "5000:5000"
    volumes:
      # 上传文件持久化（容器删除后文件不丢）
      - ./uploads:/app/uploads
      # 导出文件持久化
      - ./outputs:/app/outputs
      # 配置文件（只读挂载，防止容器内误改）
      - ./backend/.env:/app/backend/.env:ro
    restart: unless-stopped
    # GPU 用户：取消下面 6 行的注释以启用 GPU 加速
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
