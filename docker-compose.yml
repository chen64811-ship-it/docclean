# ============================================================
# DocClean Docker Compose Configuration
#
# Usage (run from project root):
#
#   1. Ensure backend/.env exists (copy from .env.example):
#      copy .env.example backend\.env     (Windows CMD)
#      cp .env.example backend/.env       (Linux / Mac / Git Bash)
#
#   2. Start CPU version (default, no GPU needed):
#      docker-compose up -d
#
#   3. Start GPU version (requires NVIDIA GPU + nvidia-container-toolkit):
#      Change line 39 below from "Dockerfile" to "Dockerfile.gpu"
#      Uncomment lines 45-51 (deploy section)
#      Then run: docker-compose up -d
#
#   4. Open browser: http://localhost:5000
#
#   5. Stop: docker-compose down
# ============================================================

services:
  docclean:
    build:
      context: .
      dockerfile: Dockerfile
      # GPU users: change the line above to →  dockerfile: Dockerfile.gpu
    container_name: docclean
    ports:
      - "5000:5000"
    volumes:
      # Upload persistence (survives container removal)
      - ./uploads:/app/uploads
      # Export persistence
      - ./outputs:/app/outputs
      # Config file (read-only mount, prevents accidental modification inside container)
      - ./backend/.env:/app/backend/.env:ro
      # Load .env as environment variables (docker restart won't re-read the file)
      env_file: ./backend/.env
    restart: unless-stopped
    # GPU users: uncomment the 6 lines below to enable GPU acceleration
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
